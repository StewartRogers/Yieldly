name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: without this the job inherits the repository default, which
# on older repos is read/write on every scope — so anything executing during
# `npm install` (arbitrary lifecycle scripts) could push to main.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Pinned to a commit SHA rather than the mutable `v4` tag — a tag can be
      # moved to point at different (potentially compromised) code without
      # this workflow file changing. Comment names the version for readability;
      # bump both the SHA and the comment together when upgrading.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      # `npm test` runs all four suites (math, full, auth, history). CI
      # previously ran only test.js, so the security-critical auth suite —
      # login rate limiting, JWT cookies, the route guard, backup import —
      # never ran on any push or PR.
      - name: Run test suite
        run: npm test
